<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客戶問題點管理系統</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1d2733;--sub:#5f6b7a;--line:#d9dee6;--hd:#1f2d3d;--hd2:#2b3d52;--acc:#1f6feb;--accS:#e7f0ff;--A:#d93a3a;--B:#e08a12;--C:#5b7a99;--ok:#1f9d55;--bad:#d93a3a;--warn:#e08a12}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.5px}
header .ver{font-size:11px;opacity:.55}
.filebar{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fstat{font-size:12px;opacity:.9;margin-right:4px}
.fstat.warn{color:#ffcf7a}
nav{background:var(--hd2);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;color:#c9d4e2;padding:10px 16px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#4da3ff;font-weight:700}
nav button.new{color:#9fd0ff}
main{padding:16px;max-width:1440px;margin:0 auto}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#f0c4c4}
.btn.sm{padding:3px 8px;font-size:12px}
header .btn{background:#34475e;border-color:#47607d;color:#fff}
header .btn.pri{background:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .no{background:var(--hd2);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-left:5px solid var(--acc)}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .s{font-size:11px;color:var(--sub)}
.kpi.red{border-left-color:var(--bad)}.kpi.red .v{color:var(--bad)}
.kpi.amb{border-left-color:var(--warn)}
.kpi.grn{border-left-color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.fld.w2{grid-column:span 2}.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
.fld textarea{resize:vertical;min-height:54px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accS);border-color:var(--acc)}
.fld input[readonly]{background:#f5f7fa}
.req::after{content:" *";color:var(--bad)}
.inl{display:flex;gap:4px}.inl input{flex:1}
.due{font-size:13px;color:var(--ink);padding:7px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f3f5f8;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600;color:var(--sub);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:7px 8px;border-bottom:1px solid #edf0f4;vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f5f9ff}
.tbl tr.od td{background:#fff5f5}
.wrapT{overflow:auto;max-height:65vh}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.st-new{background:#e7f0ff;color:#1f5fc4}.st-wip{background:#fff3dd;color:#a5620a}.st-confirm{background:#efe7ff;color:#6b3fc4}.st-closed{background:#e3f5ea;color:#17783f}.st-cancel{background:#eceef1;color:#78828f}
.sev{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:12px}
.sA{background:var(--A)}.sB{background:var(--B)}.sC{background:var(--C)}
.tag{font-size:12px;font-weight:600}.t-ok{color:var(--ok)}.t-late{color:var(--warn)}.t-over{color:var(--bad)}.t-pending{color:var(--sub)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.filters .fld{min-width:120px}
.actbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actbar .ttl{font-size:17px;font-weight:700;margin-right:8px}
.steps{display:flex;gap:0;margin-bottom:14px}
.steps div{flex:1;text-align:center;padding:8px 4px;background:#e3e8ef;color:var(--sub);font-size:13px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.steps div:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.steps div.done{background:#bcd6f7;color:#1f4f8f}.steps div.cur{background:var(--acc);color:#fff;font-weight:700}
.steps.cancel div{background:#e3e3e3;color:#999}
.hint{font-size:12px;color:var(--sub)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:10px}
.tl .it::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl .it.auto::before{background:#aab4c2}
.tl .meta{font-size:12px;color:var(--sub)}
.tl .txt{white-space:pre-wrap}
.links a{display:block;font-size:12px;color:var(--acc);word-break:break-all}
.dtw{display:flex;gap:4px;align-items:center;position:relative}
.dtw input.dtd{flex:1.3;min-width:0}.dtw input.dtt{flex:1;min-width:0}
.dtw.bad input{border-color:var(--bad)}
.dtcal{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 6px;cursor:pointer;font-size:13px}
.dtnat{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.dtq{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:3px;min-height:22px}
.dtq button{border:1px solid var(--line);background:#f7f9fb;border-radius:12px;padding:1px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--sub)}
.dtq button:hover{border-color:var(--acc);color:var(--acc)}
.dtgood{color:var(--ok);font-weight:700;font-size:12.5px}.dtbad{color:var(--bad);font-weight:600;font-size:12px}
input.invalid{border-color:var(--bad)!important;background:#fff6f6!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:5px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.fchip:hover{border-color:var(--acc)}.fchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.phwrap{border:1.5px dashed var(--line);border-radius:8px;padding:10px}.phwrap.over{border-color:var(--acc);background:var(--accS)}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{position:relative;width:128px}
.phimg{width:128px;height:96px;border-radius:6px;background:#f3f5f8;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;border:1px solid var(--line)}
.phimg img{width:100%;height:100%;object-fit:cover}
.phcap{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.phx{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:22px;padding:0}
.lb{position:fixed;inset:0;background:rgba(10,15,25,.92);z-index:100;display:flex;align-items:center;justify-content:center}
.lb img{max-width:92vw;max-height:84vh;box-shadow:0 4px 30px #000}
.lbbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;color:#fff;font-size:13px}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.15);color:#fff;font-size:40px;width:52px;height:72px;cursor:pointer;border-radius:6px}
.lbnav.l{left:12px}.lbnav.r{right:12px}
.toast{position:fixed;right:16px;bottom:16px;background:#1f2d3d;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1}.toast.err{background:var(--bad)}
.chart{width:100%;height:auto;display:block}
.empty{color:var(--sub);text-align:center;padding:24px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.rpthead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.rpthead h2{margin:0;font-size:20px}
@media(max-width:900px){.g2{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.fld.w2{grid-column:1/-1}}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{break-inside:avoid;border-color:#ccc}.g2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>客戶問題點管理系統</h1><span class="ver" id="ver"></span>
  <div class="filebar" id="filebar"></div>
</header>
<nav id="nav">
  <button data-t="dash">儀表板</button>
  <button data-t="list">案件清單</button>
  <button data-t="new" class="new">＋ 新增案件</button>
  <button data-t="rpt">統計月報</button>
  <button data-t="set">設定</button>
</nav>
<main id="main"></main>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<datalist id="dlPeople"></datalist><datalist id="dlCust"></datalist><datalist id="dlSite"></datalist><datalist id="dlModel"></datalist><datalist id="dlContact"></datalist>
<script>
'use strict';
const VER='V1.20', SCHEMA=1, LS='CQ_DB';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const toLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const nowL=()=>toLocal(new Date());
const today=()=>nowL().slice(0,10);
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const P=s=>s?new Date(s.length===10?s+'T00:00':s):null;
const fDT=s=>s?s.replace('T',' '):'';
const fD=s=>s?s.slice(0,10):'';
const r1=n=>Math.round(n*10)/10;

const STATUS=[{k:'new',zh:'新案',en:'New'},{k:'wip',zh:'處理中',en:'In progress'},{k:'confirm',zh:'待客戶確認',en:'Awaiting customer'},{k:'closed',zh:'結案',en:'Closed'},{k:'cancel',zh:'取消',en:'Cancelled'}];
const stOf=k=>STATUS.find(s=>s.k===k)||STATUS[0];
const HANDLE=['遠端/電話處理','派工到場','回廠維修','更換/借機','其他'];
const TLTYPE=['電話','Mail','到場','內部討論','客戶回覆','其他'];

function defMaster(){return{
  customers:[], people:[],
  families:['R5','Mink','COBRA','Seco','Dolphin','Panda','Puma','Samos','Fossa','Huckepack','其他品牌'],
  categories:[{zh:'異音/振動',en:'Noise / Vibration'},{zh:'過熱',en:'Overheating'},{zh:'抽速不足/真空度異常',en:'Pumping speed / Vacuum level'},{zh:'漏油/漏水',en:'Oil / Water leak'},{zh:'電氣/控制異常',en:'Electrical / Control'},{zh:'停機/無法啟動',en:'Trip / Fails to start'},{zh:'維修品質',en:'Repair quality'},{zh:'交期延誤',en:'Delivery delay'},{zh:'服務態度/溝通',en:'Service / Communication'},{zh:'報價/帳務',en:'Quotation / Billing'},{zh:'其他',en:'Other'}],
  sources:[{zh:'Mail',en:'Email'},{zh:'電話',en:'Phone'},{zh:'業務轉達',en:'Via Sales'},{zh:'LINE',en:'LINE'},{zh:'現場反映',en:'On-site'},{zh:'集團轉介',en:'Group referral'},{zh:'其他',en:'Other'}],
  costTypes:[{zh:'保固',en:'Warranty'},{zh:'合約內',en:'Contract'},{zh:'收費',en:'Chargeable'},{zh:'善意處理',en:'Goodwill'},{zh:'待定',en:'TBD'}],
  severities:[{code:'A',zh:'停機',en:'Line down',respVal:4,respUnit:'h',actDays:3},{code:'B',zh:'影響生產',en:'Production impact',respVal:1,respUnit:'wd',actDays:5},{code:'C',zh:'一般',en:'General',respVal:3,respUnit:'wd',actDays:10}]
}}
function blankDB(){return{schemaVer:SCHEMA,app:'CQ',updatedAt:'',master:defMaster(),cases:[]}}
const OLDFAM='乾式螺旋泵|羅茨泵|渦輪分子泵|油封式旋片泵|爪式泵|檢漏儀|其他';
function migrate(d){d.master=Object.assign(defMaster(),d.master||{});if((d.master.families||[]).join('|')===OLDFAM)d.master.families=defMaster().families;d.cases=d.cases||[];d.cases.forEach(c=>{c.timeline=c.timeline||[];c.d8=c.d8||{on:false};c.photos=c.photos||[];if(c.contactInfo&&!(c.mobile||c.tel||c.email)){const v=c.contactInfo;if(/@/.test(v))c.email=v;else if(/^09/.test(v.replace(/\D/g,'')))c.mobile=v;else c.tel=v}delete c.contactInfo});d.schemaVer=SCHEMA;return d}
let DB=null;try{DB=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!DB||DB.app!=='CQ')DB=blankDB();migrate(DB);

function blankCase(){const m=DB.master;return{id:uid(),no:'',status:'new',receivedAt:nowL(),source:(m.sources[0]||{}).zh||'',receiver:'',customer:'',site:'',contact:'',contactDept:'',contactTitle:'',mobile:'',tel:'',ext:'',email:'',family:'',model:'',serial:'',woNo:'',severity:'B',owner:'',desc:'',attach:'',firstRespAt:'',category:'',handle:'',measureAt:'',phenomenon:'',containment:'',result:'',custConfirmAt:'',custReply:'',closedAt:'',costType:'',rootCause:'',permanent:'',d8:{on:false},timeline:[],photos:[],createdAt:'',updatedAt:''}}

/* ---------- 時效 ---------- */
function addWD(d,n){const r=new Date(d);let k=0;while(k<n){r.setDate(r.getDate()+1);const w=r.getDay();if(w!==0&&w!==6)k++}return r}
const sevOf=code=>DB.master.severities.find(s=>s.code===code)||DB.master.severities[DB.master.severities.length-1]||{code:'C',respVal:3,respUnit:'wd',actDays:10};
function dueResp(c){const r=P(c.receivedAt);if(!r)return null;const s=sevOf(c.severity);return s.respUnit==='h'?new Date(r.getTime()+(+s.respVal)*3600e3):addWD(r,+s.respVal)}
function dueAct(c){const r=P(c.receivedAt);if(!r)return null;const d=addWD(r,+sevOf(c.severity).actDays);d.setHours(23,59,59,0);return d}
const isOpen=c=>c.status!=='closed'&&c.status!=='cancel';
function respState(c){if(c.status==='cancel')return'';const due=dueResp(c);if(!due)return'';if(c.firstRespAt)return P(c.firstRespAt)<=due?'ok':'late';return new Date()>due?'over':'pending'}
function actState(c){if(c.status==='cancel')return'';const due=dueAct(c);if(!due)return'';const m=c.measureAt||(c.status==='closed'?fD(c.closedAt):'');if(m)return P(m)<=due?'ok':'late';return new Date()>due?'over':'pending'}
const overdue=c=>isOpen(c)&&(respState(c)==='over'||actState(c)==='over');
const respHrs=c=>c.firstRespAt&&c.receivedAt?(P(c.firstRespAt)-P(c.receivedAt))/3600e3:null;
const ageDays=c=>{const r=P(c.receivedAt);if(!r)return 0;const e=c.status==='closed'&&c.closedAt?P(c.closedAt):new Date();return(e-r)/864e5};
function fmtDue(d){return d?toLocal(d).replace('T',' '):'—'}
function stateTag(s,due){const t={ok:'✓ 達成',late:'⚠ 逾時完成',over:'✕ 已逾期',pending:''}[s];if(s==='pending'&&due){const h=(due-new Date())/3600e3;return`<span class="tag t-pending">剩 ${h<48?r1(h)+' 小時':r1(h/24)+' 天'}</span>`}return t?`<span class="tag t-${s}">${t}</span>`:''}

/* ---------- 狀態 / 存檔 ---------- */
let ST={tab:'dash',draft:null,isNew:false,dirty:false,f:{status:'open',sev:'',cust:'',fam:'',owner:'',from:'',to:'',q:''},rm:ym(new Date()),lang:'zh'};
function persist(){DB.updatedAt=new Date().toISOString();try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('本機儲存失敗：'+e.message,true)}scheduleFileSave()}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',2600)}
function genNo(c){const d=P(c.receivedAt)||new Date();const pre=`CQ-${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}-`;let m=0;DB.cases.forEach(x=>{if(x.no&&x.no.startsWith(pre)){const n=parseInt(x.no.slice(pre.length),10);if(n>m)m=n}});return pre+String(m+1).padStart(3,'0')}

/* ---------- 資料夾同步 (File System Access) ---------- */
const FSA='showDirectoryPicker' in window;
const DATAFILE='客戶問題點資料.json', PHOTODIR='photos';
let DH=null,FH=null,PDH=null,fileOK=false,fileStamp='',lastSync=null,saveTimer=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('CQ_FS',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(v,k)}catch(e){}}
async function ensurePerm(ask){if(!DH)return false;try{let p=await DH.queryPermission({mode:'readwrite'});if(p!=='granted'&&ask)p=await DH.requestPermission({mode:'readwrite'});fileOK=p==='granted'}catch(e){fileOK=false}
  if(fileOK&&!FH){try{FH=await findDataFile(DH);PDH=await DH.getDirectoryHandle(PHOTODIR,{create:true})}catch(e){fileOK=false;toast('資料夾存取失敗：'+e.message,true)}}return fileOK}
async function findDataFile(dir){
  try{return await dir.getFileHandle(DATAFILE)}catch(e){}
  for await(const[name,h]of dir.entries()){if(h.kind==='file'&&/\.json$/i.test(name)){try{const d=JSON.parse(await(await h.getFile()).text());if(d&&d.app==='CQ')return h}catch(e){}}}
  return await dir.getFileHandle(DATAFILE,{create:true})
}
async function linkDir(){try{const h=await showDirectoryPicker({id:'cq',mode:'readwrite'});DH=h;FH=null;PDH=null;photoCache.clear();await idbSet('dh',h);await loadFromFile(true)}catch(e){if(e.name!=='AbortError')toast('連結失敗：'+e.message,true)}}
async function loadFromFile(ask){
  if(!await ensurePerm(ask)){updFile();return}
  try{
    const txt=await(await FH.getFile()).text();
    if(!txt.trim()){await writeFile(true);toast('已在資料夾建立 '+FH.name);return}
    const d=JSON.parse(txt);
    if(d.app!=='CQ'){alert('資料檔不是本系統的格式');updFile();return}
    if(DB.cases.length&&DB.updatedAt&&d.updatedAt&&DB.updatedAt>d.updatedAt&&!confirm('本機資料比資料夾裡的檔案還新。\n確定＝以檔案內容覆蓋本機\n取消＝以本機資料覆寫檔案')){await writeFile(true);return}
    DB=migrate(d);fileStamp=d.updatedAt||'';lastSync=new Date();
    localStorage.setItem(LS,JSON.stringify(DB));
    if(ST.tab==='edit'&&ST.draft&&!ST.isNew&&!ST.dirty){const c=DB.cases.find(x=>x.id===ST.draft.id);ST.draft=c?structuredClone(c):null;if(!c)ST.tab='list'}
    updFile();render();toast('已載入資料')

  const bmp=await createImageBitmap(file);let{width:w,height:h}=bmp;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(bmp,0,0,w,h);bmp.close&&bmp.close();
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',q))
}

function parseD(s){s=String(s).trim().replace(/[年月\.\-．]/g,'/').replace(/日/g,'');if(!s)return'';let y,m,d;
  if(/^\d{8}$/.test(s)){y=+s.slice(0,4);m=+s.slice(4,6);d=+s.slice(6)}
  else if(/^\d{3,4}$/.test(s)){m=+s.slice(0,-2);d=+s.slice(-2)}
  else if(/^\d{1,2}$/.test(s)){m=new Date().getMonth()+1;d=+s}
  else{const p=s.split('/').filter(Boolean).map(Number);if(p.length===3){[y,m,d]=p;if(y<100)y+=2000;else if(y<300)y+=1911}else if(p.length===2)[m,d]=p;else return null}
  if(!y){const t=new Date();y=t.getFullYear();if(new Date(y,m-1,d)-t>45*864e5)y--}
  const x=new Date(y,m-1,d);if(isNaN(x)||x.getMonth()!==m-1||x.getDate()!==d)return null;return`${y}-${pad(m)}-${pad(d)}`}
function parseT(s){s=String(s).trim().replace(/：/g,':');if(!s)return'';const pm=/下午|晚上|pm/i.test(s);s=s.replace(/上午|下午|早上|晚上|am|pm|\s|點/ig,m=>m==='點'?':':'').replace(/:$/,'');let h,mi;
  if(/^\d{1,2}$/.test(s)){h=+s;mi=0}else if(/^\d{3,4}$/.test(s)){h=+s.slice(0,-2);mi=+s.slice(-2)}else{const p=s.split(':');if(p.length!==2)return null;h=+p[0];mi=+(p[1]||0)}
  if(pm&&h<12)h+=12;if(isNaN(h)||isNaN(mi)||h>23||mi>59)return null;return pad(h)+':'+pad(mi)}

function stats(ymS){
  const cs=DB.cases.filter(c=>c.status!=='cancel');const inM=s=>s&&s.slice(0,7)===ymS;
  const[y,m]=ymS.split('-').map(Number);const end=new Date(y,m,0,23,59,59);
  const recv=cs.filter(c=>inM(c.receivedAt)),closed=cs.filter(c=>c.status==='closed'&&inM(c.closedAt));
  const openEnd=cs.filter(c=>P(c.receivedAt)<=end&&!(c.status==='closed'&&c.closedAt&&P(c.closedAt)<=end));
  const rs=recv.map(respState),judged=rs.filter(s=>s==='ok'||s==='late'||s==='over').length,ok=rs.filter(s=>s==='ok').length;
  const as=recv.map(actState),aj=as.filter(s=>s==='ok'||s==='late'||s==='over').length,aok=as.filter(s=>s==='ok').length;
  const rh=recv.map(respHrs).filter(v=>v!=null);const cd=closed.map(c=>(P(c.closedAt)-P(c.receivedAt))/864e5);
  return{recv,closed,openEnd,respRate:judged?ok/judged*100:null,judged,actRate:aj?aok/aj*100:null,aj,avgResp:rh.length?rh.reduce((a,b)=>a+b,0)/rh.length:null,avgClose:cd.length?cd.reduce((a,b)=>a+b,0)/cd.length:null}
}

function filtered(){const f=ST.f,q=f.q.trim().toLowerCase();return DB.cases.filter(c=>{
  if(f.status==='open'&&!isOpen(c))return false;if(f.status==='od'&&!overdue(c))return false;if(f.status&&!['open','od'].includes(f.status)&&c.status!==f.status)return false;
  if(f.sev&&c.severity!==f.sev)return false;if(f.cust&&c.customer!==f.cust)return false;if(f.fam&&c.family!==f.fam)return false;if(f.owner&&c.owner!==f.owner)return false;
  const d=fD(c.receivedAt);if(f.from&&d<f.from)return false;if(f.to&&d>f.to)return false;
  if(q&&!['no','customer','site','model','serial','desc','woNo','contact','contactDept','mobile','tel','email','owner','category'].some(k=>String(c[k]||'').toLowerCase().includes(q)))return false;return true}).sort((a,b)=>String(b.receivedAt).localeCompare(a.receivedAt))}

function exportCSV(arr){
  const cols=[['no','案號'],['status','狀態'],['receivedAt','受理時間'],['source','來源'],['receiver','受理人'],['customer','客戶'],['site','縣市'],['contact','聯絡人'],['contactDept','單位'],['contactTitle','職位'],['mobile','手機'],['tel','市話'],['ext','分機'],['email','Email'],['family','機種家族'],['model','型號'],['serial','序號'],['woNo','報工工單號'],['severity','急迫度'],['owner','負責人'],['desc','問題描述'],['firstRespAt','首次回應'],['category','問題分類'],['handle','處置方式'],['measureAt','對策提出日'],['phenomenon','現象確認'],['containment','暫時對策'],['result','處置結果'],['custConfirmAt','客戶確認日'],['closedAt','結案時間'],['costType','費用歸屬'],['rootCause','根本原因'],['permanent','永久對策']];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[cols.map(c=>c[1]).concat(['回應時效','對策時效','天數']).map(q).join(',')].concat(arr.map(c=>cols.map(([k])=>k==='status'?stOf(c.status).zh:c[k]).concat([respState(c),actState(c),r1(ageDays(c))]).map(q).join(',')));
  download(`客戶問題點清單_${today()}.csv`,'\ufeff'+rows.join('\r\n'),'text/csv')
}

    ST.draft.timeline.push({id:uid(),at:ST.tlAt||nowL(),by:$('#tlBy').value.trim(),type:$('#tlType').value,text});$('#tlText').value='';ST.tlAt=nowL();const tw=document.querySelector('[data-dtw="_tl"]');tw.querySelector('.dtd').value=today().replace(/-/g,'/');tw.querySelector('.dtt').value=ST.tlAt.slice(11);commitDT(tw,true);markDirty();drawTL()};
}
function commitDT(w,normalize){
  const p=w.dataset.dtw,dOnly=!!w.dataset.donly,di=w.querySelector('.dtd'),ti=w.querySelector('.dtt'),ok=document.querySelector(`[data-dtok="${p}"]`);
  const d=parseD(di.value),t=dOnly?'':parseT(ti.value);
  const bad=m=>{ok.innerHTML=`<span class="dtbad">✗ ${m}</span>`;w.classList.add('bad')};w.classList.remove('bad');
  if(d===null)return bad('日期看不懂，例：10/8、1008、2026/10/8');
  if(!dOnly&&t===null)return bad('時間看不懂，例：1430、14:30、下午2');
  let val='',note='';
  if(d){let tt=t;if(!dOnly&&!tt){tt=d===today()?nowL().slice(11):'08:30';note=`未填時間，以 ${tt} 計`}val=dOnly?d:d+'T'+tt}
  else if(t)return bad('請填日期');
  if(val!==gv(p)){sv(p,val);if(p!=='_tl')markDirty();if(['receivedAt','firstRespAt','measureAt'].includes(p))updDue()}
  if(normalize){di.value=d?d.replace(/-/g,'/'):'';if(ti&&t)ti.value=t}
  if(!val){ok.innerHTML='';return}
  const fut=P(val)-new Date()>864e5;
  ok.innerHTML=`<span class="dtgood">✓ ${nice(val)}</span>${note?` <span class="hint">${note}</span>`:''}${fut?' <span class="dtbad">⚠ 未來日期</span>':''}`;
  if(p==='receivedAt'||p==='firstRespAt'||p==='closedAt'){const r=P(ST.draft.receivedAt);if(p!=='receivedAt'&&r&&P(val)<r)ok.innerHTML+=' <span class="dtbad">⚠ 早於受理時間</span>'}
}
function famChips(){const m=DB.master.families,v=ST.draft.family;return m.map(x=>`<button type="button" class="fchip ${x===v?'on':''}" data-fam="${esc(x)}">${esc(x)}</button>`).join('')+(v&&!m.includes(v)?`<button type="button" class="fchip on" data-fam="${esc(v)}">${esc(v)}（已不在主檔）</button>`:'')}
function fillModels(){const fam=ST.draft.family;const set=new Set(DB.cases.filter(c=>!fam||c.family===fam).map(c=>c.model).filter(Boolean));$('#dlModel').innerHTML=[...set].sort().map(x=>`<option value="${esc(x)}">`).join('')}
function markDirty(){ST.dirty=true;const h=$('#dirtyH');if(h)h.textContent='● 未儲存'}
function updDue(){const c=ST.draft,b=$('#dueBox');if(!b)return;const s=sevOf(c.severity),dr=dueResp(c),da=dueAct(c);
  b.innerHTML=`首次回應：<b>${fmtDue(dr)}</b> ${stateTag(respState(c),dr)}<br>對策提出：<b>${da?fD(toLocal(da)):'—'}</b> ${stateTag(actState(c),da)} <span class="hint">（${s.code} 級：回應 ${s.respVal}${s.respUnit==='h'?' 小時':' 個工作天'}／對策 ${s.actDays} 個工作天）</span>`}
function updLinks(){const b=$('#linkBox');if(!b)return;const ls=String(ST.draft.attach||'').split('\n').map(s=>s.trim()).filter(Boolean);
  b.innerHTML=ls.map(l=>/^(https?:|file:|\\\\)/i.test(l)?`<a href="${esc(l.startsWith('\\\\')?'file:'+l.replace(/\\/g,'/'):l)}" target="_blank" rel="noopener">🔗 ${esc(l)}</a>`:`<span class="hint">📎 ${esc(l)}</span><br>`).join('')}
function drawTL(){const b=$('#tlBox');const arr=[...ST.draft.timeline].sort((a,b)=>String(b.at).localeCompare(a.at));
  b.innerHTML=arr.length?arr.map(t=>`<div class="it ${t.auto?'auto':''}"><div class="meta">${esc(fDT(t.at))}　${esc(t.type||'')}　${esc(t.by||'')} ${t.auto?'':`<button class="btn sm danger noprint" data-tldel="${t.id}" style="margin-left:6px">刪除</button>`}</div><div class="txt">${esc(t.text)}</div></div>`).join(''):'<div class="hint">尚無歷程紀錄</div>'}
function validate(c){const miss=[];if(!c.receivedAt)miss.push('受理時間');if(!String(c.customer).trim())miss.push('客戶');if(!String(c.desc).trim())miss.push('問題描述');if(!c.source)miss.push('來源管道');if(!c.severity)miss.push('急迫度');if(miss.length){alert('請先填寫：'+miss.join('、'));return false}return true}
function saveCase(silent){
  const c=ST.draft;if(!validate(c))return false;
  if(c.status==='closed'&&!c.closedAt)c.closedAt=nowL();
  const ts=new Date().toISOString();
  if(ST.isNew||!c.no){c.no=genNo(c);c.createdAt=ts}
  c.updatedAt=ts;
  const i=DB.cases.findIndex(x=>x.id===c.id);
  if(i>=0){const keep=new Set((c.photos||[]).map(p=>p.f));removePhotoFiles((DB.cases[i].photos||[]).map(p=>p.f).filter(f=>!keep.has(f)))}
  if(i>=0)DB.cases[i]=structuredClone(c);else DB.cases.push(structuredClone(c));
  persist();ST.isNew=false;ST.dirty=false;if(!silent)toast('已儲存 '+c.no);render();return true
}
function changeStatus(to){
  const c=ST.draft,from=c.status;
  if(to==='wip'&&from==='new'&&!c.firstRespAt){if(confirm('首次回應時間尚未填寫，是否以現在時間填入？'))c.firstRespAt=nowL()}
  if(to==='closed'){
    if(!String(c.result).trim()&&!String(c.rootCause).trim()){alert('結案前請至少填寫「處置結果」或「根本原因」');return}
    if(!c.costType&&!confirm('費用歸屬尚未選擇，仍要結案？'))return;
    if(!c.closedAt)c.closedAt=nowL();
  }
  if(to==='cancel'){const why=prompt('取消原因？');if(why===null)return;c.timeline.push({id:uid(),at:nowL(),by:'',type:'其他',text:'取消原因：'+why})}
  if(to==='wip'&&(from==='closed'||from==='cancel')){if(!confirm('重新開啟此案件？'))return;c.closedAt=''}
  c.status=to;c.timeline.push({id:uid(),at:nowL(),by:'',type:'狀態',text:`狀態變更：${stOf(from).zh} → ${stOf(to).zh}`,auto:true});
  ST.dirty=true;saveCase(true);toast(`${c.no}：${stOf(to).zh}`)
}
